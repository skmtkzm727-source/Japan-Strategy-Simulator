name: Test and Deploy NATION FRONTIER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct game source
        run: |
          cat source/archive.part* | base64 -d > /tmp/nation-frontier.tar.gz
          gzip -t /tmp/nation-frontier.tar.gz
          mkdir -p public
          tar -xzf /tmp/nation-frontier.tar.gz -C public --strip-components=1
          test -s public/index.html
          test -s public/src/main.js
          test -s public/src/simulation.js
      - name: Test game core
        working-directory: public
        run: |
          npm test
          npm run check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
