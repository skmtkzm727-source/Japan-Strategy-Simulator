name: Test and Deploy NATION FRONTIER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract NATION FRONTIER
        run: |
          mkdir -p public
          tar -xJf source/nation-frontier.tar.xz -C public --strip-components=1
          test -s public/index.html
          test -s public/src/main.js
          test -s public/src/simulation.js
          test -s public/package.json

      - name: Test simulation and check JavaScript
        working-directory: public
        run: |
          npm test
          npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
